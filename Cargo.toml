[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# 依赖版本集中在这里，crate 里写 `csv.workspace = true` 即可。
# 先只加任务 1 需要的；任务 2 用到矩阵/统计时再取消注释。
[workspace.dependencies]
anyhow = "1"
approx = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1.4"
itertools = "0.15"
ndarray = "0.17"
rand = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statrs = "0.19"
tempfile = "3"
thiserror = "2"

# polars 编译很慢（几分钟），而且 API 变动频繁。建议任务 2 的 Q4 之前用纯 Rust
# （Vec + HashMap + 滚动窗口），确实需要 DataFrame 时再打开：
# polars = { version = "0.55", features = ["lazy", "csv", "dtype-date", "dtype-datetime", "temporal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.cargo]
# 依赖是按里程碑分批加进来的，先允许「暂时没用到」，不然每次 cargo check 都刷一屏
unused_workspace_dependencies = "allow"
unused_dependencies = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
